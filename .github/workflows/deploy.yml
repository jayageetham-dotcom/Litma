name: 🚀 Deploy Litma

# Push to main →
#   1. build the static site (apps/web: Next.js export, served at the root of https://getlitma.in)
#   2. sync out/ to getlitma.in's folder on the web host over FTPS
#      (needs the LITMA_FTP_USERNAME variable and LITMA_FTP_PASSWORD secret; see README → Deploy)
#   3. (optional) deploy Supabase Edge Functions + database migrations
#
# Follows the same pattern as jayageetham-dotcom/website.

on:
  push:
    branches: [main]
    # the desktop app has its own release workflow (desktop.yml)
    paths-ignore:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  # called by the Release workflow with the release tag
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-litma
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Build & upload site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The web host also holds other sites (jayageetham.com and /onnayi, whose
      # uploads/ and api/config.php exist nowhere else). Litma's FTP account is
      # locked to getlitma.in's folder, and the upload below never deletes
      # anything on the server. This guard makes adding a delete flag a build failure.
      - name: 🔒 Refuse to delete files on the server
        run: |
          if grep -nE '^[[:space:]]*mirror .*(--delete|[[:space:]]-e[[:space:]])' .github/workflows/deploy.yml; then
            echo "::error::The FTP upload must never delete server files. Remove --delete / -e from the mirror command."
            exit 1
          fi
          echo "Upload is add/replace only. Nothing on the server is ever deleted."

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: 🔍 Check shared code is in sync with Edge Functions
        run: |
          node scripts/sync-shared.mjs
          git diff --exit-code -- supabase/functions/_shared || (echo "::error::Run 'npm run sync:shared' and commit." && exit 1)

      - name: 🎨 Check design tokens are exported
        run: |
          node scripts/export-tokens.mjs
          git diff --exit-code -- packages/tokens/tokens.json || (echo "::error::Run 'npm run tokens' and commit." && exit 1)

      - name: 📚 Cache Olam dictionary downloads
        uses: actions/cache@v5
        with:
          path: .dict-cache
          key: olam-datasets-v1

      - name: 📚 Build dictionary shards (Olam open datasets)
        run: node scripts/build-dictionary.mjs --cache .dict-cache --out apps/web/public/dict

      - name: 🔨 Build
        run: |
          npm ci
          npm run typecheck -w @litma/web
          npm run build -w @litma/web
        env:
          CI: false
          # Public values; defaults come from .env.production. Override with repo variables if needed.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jdexadomaxjtxlvgtldu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_XH6LhcIvUP_ENNbZFrmj7g_Z-YjUzP4' }}
          NEXT_PUBLIC_SITE_URL: https://getlitma.in
          NEXT_PUBLIC_BASE_PATH: ""

      # lftp instead of FTP-Deploy-Action: cPanel's FTPS server resets connections
      # when one session creates thousands of files. lftp reconnects and retries each
      # file, uploads in parallel, and skips files whose size hasn't changed — so a
      # re-run after a failure resumes instead of starting over.
      - name: 🧰 Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 📂 Upload to getlitma.in (FTPS, resumable)
        env:
          # Repository settings → Secrets and variables → Actions:
          #   variable LITMA_FTP_USERNAME  the FTP account made for getlitma.in (e.g. deploy@getlitma.in)
          #   secret   LITMA_FTP_PASSWORD  its password
          #   variable LITMA_FTP_SERVER    optional, defaults to ftp.getlitma.in
          #   variable LITMA_FTP_DIR       optional, defaults to "/" (the account's own folder, i.e. getlitma.in's web root)
          # Until the username and password exist the site is built and checked but not uploaded,
          # so the old address (jayageetham.com/litma) keeps running untouched.
          FTP_HOST: ${{ vars.LITMA_FTP_SERVER || 'ftp.getlitma.in' }}
          FTP_USER: ${{ vars.LITMA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LITMA_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.LITMA_FTP_DIR || '/' }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::getlitma.in FTP account not set up yet (LITMA_FTP_USERNAME variable and LITMA_FTP_PASSWORD secret). The site was built but not uploaded."
            exit 0
          fi
          # The mirror compares sizes only, so a changed file of the same size (version.json, an HTML page)
          # would be skipped. Files under _next/ carry a content hash in their name and dict/ is built data;
          # every other file is small, so it is always uploaded again, after the mirror (new chunks land first).
          ALWAYS=$(cd apps/web/out && find . -type f -not -path './_next/*' -not -path './dict/*' -not -name .DS_Store | sed 's|^\./||' | sort | tr '\n' ' ')
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt"
            if lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set mirror:parallel-transfer-count 4
          set cmd:fail-exit true
          mirror --reverse --ignore-time --no-perms --verbose=1 --exclude-glob .DS_Store ./apps/web/out/ $FTP_DIR
          lcd ./apps/web/out
          mput -d -O $FTP_DIR $ALWAYS
          bye
          LFTP
            then echo "Upload complete"; exit 0; fi
            echo "Attempt $attempt failed — retrying in 20s (already-uploaded files are skipped)"
            sleep 20
          done
          echo "::error::FTP upload failed after 3 attempts."
          exit 1

  supabase-deploy:
    name: ⚡ Edge Functions & database
    runs-on: ubuntu-latest
    # Runs only once SUPABASE_ACCESS_TOKEN is added as a repository secret.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.ref == 'refs/heads/main' || inputs.ref != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jdexadomaxjtxlvgtldu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Skip when no Supabase token
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN secret — skipping Supabase deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy litma-transliterate --remote="$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy litma-mcp --remote="$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy litma-ai --remote="$PROJECT_REF" --yes

      - name: Apply database migrations
        if: steps.check.outputs.skip != 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
