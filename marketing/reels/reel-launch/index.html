      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--mist);
        font-family: "Anek Malayalam", sans-serif; }
      /* soft colour fields like the home page hero (the owner approved these on public pages) */
      .field { position: absolute; border-radius: 50%; }
      #f1 { left: -420px; top: -360px; width: 1300px; height: 1300px; background: radial-gradient(circle, rgba(124,92,255,0.75) 0%, rgba(124,92,255,0) 68%); }
      #f2 { left: 380px; top: 520px; width: 1200px; height: 1200px; background: radial-gradient(circle, rgba(255,190,150,0.85) 0%, rgba(255,190,150,0) 66%); }
      #f3 { left: -300px; top: 1150px; width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(170,215,255,0.8) 0%, rgba(170,215,255,0) 66%); }
      #f4 { left: 560px; top: -260px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 66%); }
      .glass { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,0.42); border: 2px solid rgba(255,255,255,0.85);
        box-shadow: 0 18px 40px rgba(60,40,140,0.14), inset 0 2px 0 rgba(255,255,255,0.9); }
      .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); }

      /* the phone: a plain device frame around the real app (no brand marks) */
      #phone { position: absolute; left: 128px; top: 0; width: 824px; height: 1732px; transform-origin: 412px 0px; z-index: 5; }
      #bezel { position: absolute; inset: 0; border-radius: 124px; background: var(--bezel);
        box-shadow: 0 0 0 4px #2b2b33, 0 0 0 7px #0c0c10, 0 60px 120px rgba(40,20,110,0.35), 0 20px 40px rgba(40,20,110,0.25); }
      #screen { position: absolute; left: 22px; top: 22px; width: 780px; height: 1688px; border-radius: 102px; overflow: hidden; background: #0f0f12; }
      #status { position: absolute; left: 0; top: 0; width: 780px; height: 92px; background: #0f0f12; color: #fff;
        font: 600 46px/92px Inter, "Anek Malayalam", sans-serif; z-index: 3; }
      #status .time { position: absolute; left: 92px; top: 4px; }
      #status .icons { position: absolute; right: 78px; top: 32px; display: flex; gap: 12px; align-items: center; }
      #island { position: absolute; left: 280px; top: 22px; width: 220px; height: 62px; border-radius: 40px; background: #000; z-index: 4; }
      .scr { position: absolute; left: 0; top: 92px; width: 780px; height: 1596px; object-fit: cover; }
      #side1, #side2, #side3 { position: absolute; width: 8px; border-radius: 4px; background: #23232b; }
      #side1 { left: -10px; top: 330px; height: 110px; } #side2 { left: -10px; top: 470px; height: 110px; } #side3 { right: -10px; top: 400px; height: 170px; }

      /* a plain monitor for the desktop app beat */
      #monitor { position: absolute; left: 60px; top: 360px; width: 960px; z-index: 4; opacity: 0; }
      #mon-frame { position: relative; width: 960px; height: 616px; border-radius: 26px; background: #0c0c10; padding: 18px;
        box-shadow: 0 0 0 3px #2b2b33, 0 50px 90px rgba(40,20,110,0.3); }
      #mon-screen { position: relative; width: 924px; height: 578px; border-radius: 10px; overflow: hidden; background: #0f0f12; }
      #v-desktop { position: absolute; inset: 0; width: 924px; height: 578px; object-fit: cover; }
      #mon-neck { width: 150px; height: 120px; margin: 0 auto; background: linear-gradient(#cfcbe0, #b7b2cc); }
      #mon-foot { width: 380px; height: 18px; margin: 0 auto; border-radius: 10px; background: #bdb8d2; }
    </style>
  </head>
  <body>

      <div class="glass" id="g2" style="left:880px;top:300px;width:120px;height:120px"><svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></div>
      <div class="glass" id="g3" style="left:70px;top:1210px;width:120px;height:120px"><svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></svg></div>
      <div class="glass" id="g4" style="left:880px;top:1200px;width:140px;height:140px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg></div>
      <div class="glass" id="g5" style="left:900px;top:760px;width:96px;height:96px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></div>
      <div class="glass" id="g6" style="left:40px;top:700px;width:96px;height:96px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="3.4" data-track-index="3" style="position:absolute;inset:0;z-index:7" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
           data-start="3.0" data-duration="2.4" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="monitor" data-layout-allow-overflow>
        <div id="mon-frame"><div id="mon-screen">
          <video id="v-desktop" class="clip" src="assets/desktop.mp4" muted playsinline data-start="24.3" data-duration="2.6" data-media-start="0.3" data-playback-rate="1.9" data-track-index="2"></video>
        </div></div>
        <div id="mon-neck"></div><div id="mon-foot"></div>
      </div>

      <div id="phone" data-layout-allow-overflow>
        <div id="side1"></div><div id="side2"></div><div id="side3"></div>
        <div id="bezel"></div>
        <div id="screen">
          <div id="status"><span class="time">9:41</span>
            <span class="icons"><svg style="display:none" width="0" height="0" viewBox="0 0 24 24" fill="none" stroke="#5b3ef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <svg width="40" height="28" viewBox="0 0 20 14"><rect x="0" y="9" width="3.4" height="5" rx="1" fill="#fff"/><rect x="5.2" y="6" width="3.4" height="8" rx="1" fill="#fff"/><rect x="10.4" y="3" width="3.4" height="11" rx="1" fill="#fff"/><rect x="15.6" y="0" width="3.4" height="14" rx="1" fill="#fff"/></svg>
              <svg width="56" height="28" viewBox="0 0 28 14"><rect x="0.8" y="0.8" width="23" height="12.4" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/><rect x="2.8" y="2.8" width="19" height="8.4" rx="2" fill="#fff"/><rect x="25.2" y="4.6" width="2" height="4.8" rx="1" fill="#fff" fill-opacity=".5"/></svg>
            </span></div>
          <div id="island"></div>
          <video id="v-hook" class="clip scr" src="assets/write.mp4" muted playsinline data-start="0" data-duration="5.0" data-media-start="0.0" data-track-index="1"></video>
          <video id="v-write" class="clip scr" src="assets/write.mp4" muted playsinline data-start="5.0" data-duration="5.5" data-media-start="1.2" data-playback-rate="2.33" data-track-index="1"></video>
          <video id="v-picker" class="clip scr" src="assets/picker.mp4" muted playsinline data-start="10.5" data-duration="3.0" data-media-start="0.5" data-playback-rate="1.8" data-track-index="1"></video>
          <video id="v-dict" class="clip scr" src="assets/dict.mp4" muted playsinline data-start="13.5" data-duration="2.5" data-media-start="1.0" data-playback-rate="2.4" data-track-index="1"></video>
          <video id="v-rhyme" class="clip scr" src="assets/dict.mp4" muted playsinline data-start="16.0" data-duration="1.5" data-media-start="11.2" data-playback-rate="1.73" data-track-index="1"></video>
          <video id="v-world" class="clip scr" src="assets/world.mp4" muted playsinline data-start="17.5" data-duration="3.0" data-media-start="0.9" data-playback-rate="2.13" data-track-index="1"></video>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="26.8" data-duration="3.2" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="vo1" class="clip" src="assets/vo1.wav" data-start="0.3" data-duration="2.22" data-track-index="8" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/vo2.wav" data-start="3.1" data-duration="1.38" data-track-index="8" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/vo3.wav" data-start="5.3" data-duration="2.70" data-track-index="8" data-volume="1"></audio>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const P = "#phone";
      tl.set("#screen", { scale: 1 }, 0);
      // hook: phone small in the middle, questions around it
      tl.set(P, { scale: 0.52, x: 0, y: 470 }, 0);
      // reveal: phone drops a little so the logo fits above it
      tl.to(P, { scale: 0.6, y: 640, duration: 0.5, ease: "power3.inOut" }, 3.0);
      // the app: phone comes up big, still a phone
      tl.to(P, { scale: 0.88, y: 190, duration: 0.6, ease: "power3.inOut" }, 4.9);
      // each beat: a small shift, the phone answers the cut
      const beat = (at, x) => { tl.to(P, { x, duration: 0.45, ease: "power3.inOut" }, at - 0.2);
        tl.to("#screen", { scale: 0.965, duration: 0.01 }, at - 0.01); tl.to("#screen", { scale: 1, duration: 0.35, ease: "back.out(2)" }, at); };
      beat(10.5, -60); beat(13.5, 60); beat(17.5, -60); beat(20.5, 0);
      // a punch-in on the typed title while the Manglish turns into Malayalam
      tl.to(P, { scale: 1.25, y: 120, duration: 0.5, ease: "power3.inOut" }, 5.6);
      tl.to(P, { scale: 0.88, y: 190, duration: 0.5, ease: "power3.inOut" }, 8.6);
      // desktop: the phone steps aside and the monitor shows the same desk on a computer
      tl.to(P, { scale: 0.44, x: 250, y: 900, duration: 0.6, ease: "power3.inOut" }, 24.2);
      tl.fromTo("#monitor", { opacity: 0, y: 80, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 24.3);
      // out: both leave for the end card
      tl.to(P, { y: 2100, duration: 0.5, ease: "power3.in" }, 26.4);
      tl.to("#monitor", { opacity: 0, y: -60, duration: 0.4, ease: "power2.in" }, 26.4);
      // the colour fields and glass icons drift slowly all through
      tl.to("#f1", { x: 120, y: 90, duration: 30, ease: "sine.inOut" }, 0);
      tl.to("#f2", { x: -140, y: -60, duration: 30, ease: "sine.inOut" }, 0);
      tl.to("#f3", { x: 90, y: -120, duration: 30, ease: "sine.inOut" }, 0);
      [["#g1",-18],["#g2",22],["#g3",16],["#g4",-20],["#g5",14],["#g6",-14]].forEach(([s,d],i) => {
        for (let k = 0; k < 6; k++) tl.to(s, { y: (k % 2 ? 0 : d), duration: 2.5, ease: "sine.inOut" }, k * 5 + i * 0.4);
      });
      tl.to(".glass", { opacity: 0.0, duration: 0.4 }, 26.5);
      window.__timelines["main"] = tl;
    </script>
