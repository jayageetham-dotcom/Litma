name: 🚀 Deploy Litma

# Push to main →
#   1. build the static site (apps/web: Next.js export, served at the root of https://getlitma.in)
#   2. sync out/ to getlitma.in's folder on the web host over FTPS
#      (needs the LITMA_FTP_USERNAME variable and LITMA_FTP_PASSWORD secret; see README → Deploy)
#   3. (optional) deploy Supabase Edge Functions + database migrations
#
# Follows the same pattern as jayageetham-dotcom/website.

on:
  push:
    branches: [main]
    # the desktop app has its own release workflow (desktop.yml)
    paths-ignore:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - ".github/workflows/desktop.yml"
      # Instagram reels and posters aren't part of the site
      - "marketing/**"
  workflow_dispatch:
  # called by the Release workflow with the release tag
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-litma
  cancel-in-progress: false

env:
  # npm ci would also download Electron itself from github.com, which sometimes answers 504.
  # No step here runs Electron; electron-builder fetches (and caches) its own copy.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  web-deploy:
    name: 🎉 Build & upload site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The web host also holds other sites (jayageetham.com and /onnayi, whose
      # uploads/ and api/config.php exist nowhere else). Litma's FTP account is
      # locked to getlitma.in's folder, and the upload below never deletes
      # anything on the server. This guard makes adding a delete flag a build failure.
      - name: 🔒 Refuse to delete files on the server
        run: |
          if grep -nE '^[[:space:]]*mirror .*(--delete|[[:space:]]-e[[:space:]])' .github/workflows/deploy.yml; then
            echo "::error::The FTP upload must never delete server files. Remove --delete / -e from the mirror command."
            exit 1
          fi
          echo "Upload is add/replace only. Nothing on the server is ever deleted."

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: 🔍 Check shared code is in sync with Edge Functions
        run: |
          node scripts/sync-shared.mjs
          git diff --exit-code -- supabase/functions/_shared || (echo "::error::Run 'npm run sync:shared' and commit." && exit 1)

      - name: 🎨 Check design tokens are exported
        run: |
          node scripts/export-tokens.mjs
          git diff --exit-code -- packages/tokens/tokens.json || (echo "::error::Run 'npm run tokens' and commit." && exit 1)

      - name: 🌐 Check every UI string has a Malayalam version
        run: npm run i18n:check

      - name: 📚 Cache Olam dictionary downloads
        uses: actions/cache@v5
        with:
          path: .dict-cache
          key: olam-datasets-v1

      - name: 🔤 Cache Malayalam word frequencies
        uses: actions/cache@v5
        with:
          path: .manglish-cache
          key: manglish-words-bb8f0ad

      - name: 🔤 Build the offline Manglish word list (rhymes use it too, so it comes first)
        run: node scripts/build-manglish-words.mjs --cache .manglish-cache

      - name: 📚 Build dictionary shards (Olam open datasets)
        run: node scripts/build-dictionary.mjs --cache .dict-cache --out apps/web/public/dict

      - name: 🔨 Build
        run: |
          npm ci
          npm run typecheck -w @litma/web
          npm run build -w @litma/web
        env:
          CI: false
          # Public values; defaults come from .env.production. Override with repo variables if needed.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jdexadomaxjtxlvgtldu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_XH6LhcIvUP_ENNbZFrmj7g_Z-YjUzP4' }}
          NEXT_PUBLIC_SITE_URL: https://getlitma.in
          # Google Drive backup (Settings → Backup): a Google Cloud OAuth web client id; empty hides the button
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '' }}
          # Cloudflare Turnstile site key for the /captcha/ page (public; the secret goes in Supabase Auth)
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '' }}
          NEXT_PUBLIC_BASE_PATH: ""

      # lftp instead of FTP-Deploy-Action: cPanel's FTPS server resets connections
      # when one session creates thousands of files. lftp reconnects and retries each
      # file, uploads in parallel, and skips files whose size hasn't changed — so a
      # re-run after a failure resumes instead of starting over.
      - name: 🧰 Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 📂 Upload to getlitma.in (FTPS, resumable)
        env:
          # Repository settings → Secrets and variables → Actions (repository level, not an environment):
          #   LITMA_FTP_USERNAME  the getlitma.in FTP account (litma@getlitma.in), as a variable or a secret
          #   LITMA_FTP_PASSWORD  its password, as a secret
          #   LITMA_FTP_SERVER    optional variable, defaults to ftp.getlitma.in
          #   LITMA_FTP_DIR       optional variable: the web root inside the account. Defaults to "/", and when
          #                       the account opens on the cPanel home (public_html is inside it) the upload
          #                       goes into public_html by itself.
          FTP_HOST: ${{ vars.LITMA_FTP_SERVER || secrets.LITMA_FTP_SERVER || 'ftp.getlitma.in' }}
          FTP_USER: ${{ vars.LITMA_FTP_USERNAME || secrets.LITMA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LITMA_FTP_PASSWORD || vars.LITMA_FTP_PASSWORD }}
          FTP_DIR_SET: ${{ vars.LITMA_FTP_DIR }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        run: |
          echo "FTP server:   $FTP_HOST"
          echo "FTP username: ${FTP_USER:-(missing)}"
          echo "FTP password: $([ -n "$FTP_PASSWORD" ] && echo set || echo '(missing)')"
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            msg="getlitma.in FTP details missing: add LITMA_FTP_USERNAME (variable) and LITMA_FTP_PASSWORD (secret) under Settings → Secrets and variables → Actions, at repository level. The site was built but not uploaded."
            if [ "$MANUAL" = "true" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"; exit 0
          fi
          if ! getent hosts "$FTP_HOST" >/dev/null; then
            echo "::error::$FTP_HOST does not resolve. Set LITMA_FTP_SERVER to the FTP server shown in cPanel → FTP Accounts → Configure FTP Client."
            exit 1
          fi
          LOGIN="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:passive-mode true; set net:timeout 30; set net:max-retries 3"

          # Where are we? List the account's top folder once (also checks the login).
          # First: does the server answer at all? (A firewall that blocks GitHub looks like a timeout.)
          if ! timeout 20 bash -c "exec 3<>/dev/tcp/$FTP_HOST/21" 2>/dev/null; then
            echo "::error::$FTP_HOST does not answer on port 21 from GitHub. The password is not the problem: the host's firewall may be blocking GitHub's servers (cPanel → cPHulk Brute Force Protection or the host's firewall; ask the host to allow FTP from GitHub Actions), or FTP is down."
            exit 1
          fi
          if ! TOP=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LOGIN; cls -1a /; bye" 2>&1); then
            echo "$TOP" | tail -5
            # Run once more with the conversation shown, to tell a refused login from a broken connection.
            DBG=$(lftp -d -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 1; cls -1 /; bye" 2>&1 | sed -E 's/^(---> PASS ).*/\1****/')
            echo "What the server said:"; echo "$DBG" | grep -E '^(<---|\*\*\*\*)|SSL|TLS|refused|timed out|Login' | grep -v PASS | tail -15
            if echo "$DBG" | grep -qE '^<--- 530'; then
              echo "::error::$FTP_HOST refused the login for $FTP_USER (530). Either the password is wrong (cPanel → FTP Accounts → Change Password, then update the LITMA_FTP_PASSWORD secret) or the username is not the full FTP account name (e.g. litma@getlitma.in, in LITMA_FTP_USERNAME). After many failed tries cPHulk may block GitHub for a while too."
            elif echo "$DBG" | grep -qiE 'ssl|tls|certificate|AUTH TLS'; then
              echo "::error::$FTP_HOST answered but the secure (FTPS) connection failed. Check that FTP over TLS is on for this account in cPanel."
            else
              echo "::error::Could not sign in to $FTP_HOST as $FTP_USER. The server answered on port 21 but the session broke off (see what the server said above). cPHulk or the host's firewall may be cutting GitHub off; check cPanel → cPHulk."
            fi
            exit 1
          fi
          echo "The account's top folder holds:"; echo "$TOP" | head -30
          FTP_DIR="${FTP_DIR_SET:-/}"
          if [ -z "$FTP_DIR_SET" ] && echo "$TOP" | grep -qE '^/?public_html/?$'; then
            FTP_DIR="/public_html"
            echo "This account opens on the cPanel home, so Litma goes into /public_html."
          fi
          if echo "$TOP" | grep -qE '^/?(mail|etc)/?$' && [ "$FTP_DIR" = "/" ]; then
            echo "::error::This account opens on the cPanel home folder. Set the variable LITMA_FTP_DIR to /public_html."
            exit 1
          fi
          echo "Uploading to: $FTP_DIR"

          # The mirror compares sizes only, so a changed file of the same size (version.json, an HTML page)
          # would be skipped. Files under _next/ carry a content hash in their name and dict/ is built data;
          # every other file is small, so it is always uploaded again, after the mirror (new chunks land first).
          ALWAYS=$(cd apps/web/out && find . -type f -not -path './_next/*' -not -path './dict/*' -not -name .DS_Store | sed 's|^\./||' | sort | tr '\n' ' ')
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt"
            if lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ssl:priority NORMAL:-VERS-TLS1.3
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set mirror:parallel-transfer-count 4
          set cmd:fail-exit true
          mirror --reverse --ignore-time --no-perms --verbose=1 --exclude-glob .DS_Store ./apps/web/out/ $FTP_DIR
          lcd ./apps/web/out
          mput -d -O $FTP_DIR $ALWAYS
          bye
          LFTP
            then
              echo "Upload complete. $FTP_DIR now holds:"
              lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LOGIN; cls -1a $FTP_DIR; bye" 2>/dev/null | head -20
              exit 0
            fi
            echo "Attempt $attempt failed. Retrying in 20s (already-uploaded files are skipped)"
            sleep 20
          done
          echo "::error::FTP upload failed after 3 attempts."
          exit 1

  supabase-deploy:
    name: ⚡ Edge Functions & database
    runs-on: ubuntu-latest
    # Runs only once SUPABASE_ACCESS_TOKEN is added as a repository secret.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.ref == 'refs/heads/main' || inputs.ref != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jdexadomaxjtxlvgtldu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Skip when no Supabase token
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN secret — skipping Supabase deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # An exact version: "latest" asks GitHub's API, which fails with "rate limit exceeded" on
      # shared runners. The commands below use CLI 3 options (--remote); raise this on purpose.
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: 3.0.0

      # The spelling engine's data (mlmorph from PyPI, checked by sha256; not committed). Built first
      # so litma-spell's static files exist when the CLI reads supabase/config.toml; allowed to fail.
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Build the spelling engine's data
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/build-mlmorph.mjs

      - name: Deploy Edge Functions
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy litma-transliterate --remote="$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy litma-mcp --remote="$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy litma-ai --remote="$PROJECT_REF" --yes
          supabase functions deploy litma-track --remote="$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy litma-admin --remote="$PROJECT_REF" --yes
          supabase functions deploy litma-account --remote="$PROJECT_REF" --yes
          supabase functions deploy litma-send-email --remote="$PROJECT_REF" --no-verify-jwt --yes

      - name: Apply database migrations
        if: steps.check.outputs.skip != 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      # The Malayalam spelling engine (litma-spell, mlmorph). Allowed to fail: the editor falls back
      # to its own checks while the engine is missing, and nothing else depends on it.
      - name: Deploy the spelling engine
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # bundled on this machine (Docker): the data is about 8 MB, over server-side bundling's 5 MB limit
          supabase functions deploy litma-spell --remote="$PROJECT_REF" --use-docker --yes || {
            echo "::warning::litma-spell didn't deploy; writers get the editor's own spelling checks until it does."
            exit 1
          }
