name: 🚀 Deploy Litma

# Push to main →
#   1. build the static site (Next.js export, base path /litma)
#   2. sync out/ to public_html/litma on cPanel over FTPS
#   3. (optional) deploy Supabase Edge Functions + database migrations
#
# Follows the same pattern as jayageetham-dotcom/website.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-litma
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Build & upload site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # public_html also holds the main site and /onnayi (whose uploads/ and
      # api/config.php exist nowhere else). FTP-Deploy-Action only removes files
      # it uploaded itself, and Litma's FTP account is locked to public_html/litma,
      # so neither can be touched — unless dangerous-clean-slate is turned on.
      - name: 🔒 Refuse to wipe the server folder
        run: |
          if grep -qE '^[[:space:]]*dangerous-clean-slate:[[:space:]]*true' .github/workflows/deploy.yml; then
            echo "::error::dangerous-clean-slate is true — it deletes everything under server-dir. Set it back to false."
            exit 1
          fi
          echo "dangerous-clean-slate is false — safe."

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 🔍 Check shared code is in sync with Edge Functions
        run: |
          node scripts/sync-shared.mjs
          git diff --exit-code -- supabase/functions/_shared || (echo "::error::Run 'npm run sync:shared' and commit." && exit 1)

      - name: 🔨 Build
        run: |
          npm ci
          npm run typecheck
          npm run build
        env:
          CI: false
          # Public values; defaults come from .env.production. Override with repo variables if needed.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jdexadomaxjtxlvgtldu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_XH6LhcIvUP_ENNbZFrmj7g_Z-YjUzP4' }}
          NEXT_PUBLIC_SITE_URL: https://www.jayageetham.com/litma
          NEXT_PUBLIC_BASE_PATH: /litma

      - name: 📂 Sync files to public_html/litma
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.jayageetham.com
          username: ${{ vars.FTP_USERNAME || 'litma@jayageetham.com' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # cPanel serves the shared server's certificate, not one for ftp.jayageetham.com
          security: loose
          local-dir: ./out/
          # The litma@ FTP account's Directory is public_html/litma, so "./" is that folder.
          # If you use the main admin@ account instead, set FTP_SERVER_DIR=/litma/ (repo variable).
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Never set this true — see the guard step above.
          dangerous-clean-slate: false

  supabase-deploy:
    name: ⚡ Edge Functions & database
    runs-on: ubuntu-latest
    # Runs only once SUPABASE_ACCESS_TOKEN is added as a repository secret.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jdexadomaxjtxlvgtldu
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no Supabase token
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN secret — skipping Supabase deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy litma-transliterate --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy litma-mcp --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy litma-ai --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        if: steps.check.outputs.skip != 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
