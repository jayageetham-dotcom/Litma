name: litma
description: "Litma: write Malayalam literature. iOS and Android app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.7.13+19

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.18.3
  animations: ^3.0.0
  sqflite: ^2.4.5
  path: ^1.9.1
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.1
  flutter_svg: ^2.3.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  printing: ^5.15.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brands/
    - assets/avatars/
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: AnekMalayalam
      fonts:
        - asset: assets/fonts/AnekMalayalam_400Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekMalayalam_500Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekMalayalam_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekMalayalam_700Bold.ttf
          weight: 700
        - asset: assets/fonts/AnekMalayalam_800ExtraBold.ttf
          weight: 800
    - family: NotoSerifMalayalam
      fonts:
        - asset: assets/fonts/NotoSerifMalayalam_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifMalayalam_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifMalayalam_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifMalayalam_700Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMalayalam_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMalayalam_700Bold.ttf
          weight: 700
    - family: Manjari
      fonts:
        - asset: assets/fonts/Manjari_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manjari_700Bold.ttf
          weight: 700
    - family: Gayathri
      fonts:
        - asset: assets/fonts/Gayathri_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Gayathri_700Bold.ttf
          weight: 700

# App icon from the desktop icon (apps/desktop/build/icon.png → assets/icon/): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#111113"
  adaptive_icon_foreground: assets/icon/foreground.png

# Launch screen in Litma's canvas colours: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#f5f4f9"
  color_dark: "#09090b"
  android_12:
    color: "#f5f4f9"
    color_dark: "#09090b"
